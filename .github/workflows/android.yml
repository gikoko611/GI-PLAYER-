name: Build GI PLAYER PRO APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/GI-PLAYER-PRO.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GI-PLAYER-PRO-APK
          path: apk/GI-PLAYER-PRO.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: GI PLAYER PRO v1.0.0
          body: |
            GI PLAYER PRO - Modern Cyber Theme Video Player
            POWERED BY I KO KO
          files: apk/GI-PLAYER-PRO.apk
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
